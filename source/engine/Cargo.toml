# The verus_syn pin lives in the root `[workspace.dependencies]` table.
verus_syn.workspace = true
verus_spec_check_attr.workspace = true
verus_spec_check_exec_spec.workspace = true
verus_spec_check_expand.workspace = true
verus_spec_check_syntax.workspace = true

[lints]
workspace = true
