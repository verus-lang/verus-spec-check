authors.workspace = true
description = "Engine internals for verus-spec-check-macros (vcheck proc-macro logic)"
keywords = ["verus", "verified-rust", "verification", "proptest"]
categories = ["development-tools"]

[lib]
name = "verus_spec_check_engine"
path = "src/lib.rs"

[dependencies]
proc-macro2.workspace = true
