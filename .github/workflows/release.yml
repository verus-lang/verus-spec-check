name: Release

# Cut a tag + GitHub release for the Verus binary pinned in flake.nix. The
# binary version, rather than workspace.package.version, owns the tag date:
# Verus can release without publishing a new vstd crate.

# Private-phase release: tag + GitHub release only, no crates.io publish.
# Eventually, this will push something to crates.io once verus-spec-check is ready.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - flake.nix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine versions and tag
        id: v
        run: |
          VERUS=$(grep -oE 'verusVersion = "[^"]*";' flake.nix | head -1 \
                    | sed -E 's/verusVersion = "([^"]*)";/\1/')
          VSTD=$(awk '/^vstd *=/{ if (match($0,/"=[^"]+"/)) { print substr($0,RSTART+2,RLENGTH-3); exit } }' source/vstd_ext/Cargo.toml)
          echo "Verus binary: $VERUS"
          echo "vstd line:    $VSTD"
          if ! echo "$VERUS" | grep -qE '^0\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\..+$'; then
            echo "invalid Verus binary version in flake.nix: $VERUS" >&2
            exit 1
          fi
          if [ -z "$VSTD" ]; then
            echo "could not read the vstd version" >&2
            exit 1
          fi
          DATE=$(echo "$VERUS" | sed -E 's/^0\.([0-9]{4})\.([0-9]{2})\.([0-9]{2})\..*/\1-\2-\3/')
          TAG="verus-$DATE"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; skipping"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "release=true"
            echo "verus_version=$VERUS"
            echo "vstd_version=$VSTD"
            echo "date=$DATE"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERUS: ${{ steps.v.outputs.verus_version }}
          VSTD: ${{ steps.v.outputs.vstd_version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "verus-spec-check for Verus $VERUS"
          git push origin "$TAG"
          # Move the floating `latest` label to this release.
          git tag -f latest "$TAG"
          git push -f origin latest

          NOTES=$(cat <<EOF
          verus-spec-check paired with Verus binary \`$VERUS\` and vstd \`$VSTD\`.

          ## Use it

          Clone this tag, then point path deps at the checkout:

          \`\`\`bash
          git clone --branch $TAG --depth 1 \\
            git@github.com:JakeGinesin/verus-spec-check ~/verus-spec-check
          \`\`\`

          In your project's Cargo.toml:

          \`\`\`toml
          [dependencies]
          vstd = "=$VSTD"
          verus_spec_check = { path = "~/verus-spec-check/source/verus_spec_check" }
          verus_spec_check_vstd_ext = { path = "~/verus-spec-check/source/vstd_ext" }

          [patch.crates-io]
          verus_builtin_macros = { path = "~/verus-spec-check/source/builtin_macros_overlay" }
          \`\`\`

          The tag date matches the Verus binary release. The vstd line may be
          older when that Verus release did not publish new crates.
          \`nix develop ~/verus-spec-check\` provides the pinned Verus binary.
          EOF
          )
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
